services:
  server:
    build:
      context: .
      dockerfile: server.Dockerfile
    container_name: monorepo_server
    working_dir: /var/www
    volumes:
      - ./server:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: trkaci
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
    depends_on:
      - db
    networks:
      - appnet

  web:
    image: nginx:1.25-alpine
    container_name: monorepo_web
    ports:
      - "8080:80"
    volumes:
      - ./server:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - appnet

  client:
    build:
      context: .
      dockerfile: client.Dockerfile
    container_name: monorepo_client
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "3000"
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - web
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: monorepo_db
    environment:
      MYSQL_DATABASE: trkaci
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33061:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - appnet

networks:
  appnet:

volumes:
  dbdata: